short_bio: >-
  <p>
    I am an incoming CS PhD student at <a href="https://www.princeton.edu/" target="_blank">Princeton University</a>.
    Currently, I am a research assistant advised by <a href="https://roseyu.com/" target="_blank">Prof. Rose Yu</a>
    and <a href="https://sites.google.com/view/yianma/home" target="_blank">Prof. Yian Ma</a> in the Rose Spatio-Temporal Lab.
    In the past, I have worked with <a href="https://cseweb.ucsd.edu/~mkchandraker/" target="_blank">Prof. Manmohan Chandraker</a>
    on 3D reasoning ability of Large Language Models.
  </p>
  <p>
    My current research interest lies within the parallel of human and AI agents, focusing on:
    👀 <strong>Cognition</strong> - How humans and AI process complex environments and senses;
    🧠 <strong>Reasoning</strong> - Problem-solving from sequential planning to parallel processing;
    📊 <strong>Modeling</strong> - Modeling and guiding LLM behavior via statistical methods;
    💡 <strong>Creativity</strong> - The synergy of human insight and algorithmic processes.
  </p>

