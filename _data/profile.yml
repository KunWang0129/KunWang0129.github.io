short_bio: >-
  <p>
    Hello! I am a second-year CS Ph.D. student at Princeton University, advised by <a href="https://www.cs.princeton.edu/~olgarus/" target="_blank">Prof. Olga Russakovsky</a>.
    During my undergraduate studies at UC San Diego, I was fortunate to be advised by
    <a href="https://roseyu.com/" target="_blank">Prof. Rose Yu</a> and
    <a href="https://sites.google.com/view/yianma/home" target="_blank">Prof. Yian Ma</a> on spatio-temporal causal discovery,
    and <a href="https://cseweb.ucsd.edu/~mkchandraker/" target="_blank">Prof. Manmohan Chandraker</a>
    on 3D scene generation with Large Language Models.
  </p>
  <p>
    I'm interested in <strong>multimodal agents</strong>, currently working on <strong>robotics agents, world models, and computer-use agents</strong>.
  </p>

